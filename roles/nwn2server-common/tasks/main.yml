---

- name: Packages install
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - unzip
  tags: [base]


# Unprivileged user
- name: Unprivileged group setup
  ansible.builtin.group:
    name: "{{ unprivileged_user }}"
    gid: "{{ unprivileged_gid }}"
  tags: [base]

- name: Unprivileged user setup
  ansible.builtin.user:
    name: "{{ unprivileged_user }}"
    uid: "{{ unprivileged_uid }}"
    group: "{{ unprivileged_group }}"
  tags: [base]

# - name: Add your local SSH key to the server authorized keys
#   ansible.builtin.authorized_key:
#     user: "{{ unprivileged_user }}"
#     key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
#   tags: [base]


# UFW
- name: UFW Setup
  ansible.builtin.include_tasks: ufw.yml
  tags: [base]

# qemu network
- name: Qemu network setup
  ansible.builtin.include_tasks: tap0-network.yml
  tags: [base]

# nwn-lib-d
- name: NWN2 tools
  ansible.builtin.include_tasks: nwn-tools.yml
  when: install_nwnlibd_tools
